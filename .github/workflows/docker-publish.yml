name: Build and publish container image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Lint and offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check .
      - name: Gate tests
        run: python tests/test_gate.py
      - name: HTTP API tests (mocked upstream)
        run: python tests/test_api.py

  build:
    name: Build and push to GHCR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # keep the published image a plain single manifest per platform so any
          # docker version can `docker pull` it without provenance surprises
          provenance: false
          sbom: false
      - name: Summary
        run: |
          {
            echo "### Image"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify the published image runs
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the image
        run: docker pull "$IMAGE:latest"
      - name: Boot it against a root-owned data dir (the classic first-start trap)
        run: |
          set -euo pipefail
          mkdir -p /tmp/zen-data
          sudo chown root:root /tmp/zen-data
          docker run -d --name zen-gateway -p 8211:8211 -v /tmp/zen-data:/data "$IMAGE:latest"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8211/healthz >/dev/null 2>&1; then break; fi
            sleep 2
          done
          echo "health: $(curl -fsS http://127.0.0.1:8211/healthz)"
          echo "key file:"; sudo cat /tmp/zen-data/api-keys.txt
          sudo grep -q 'sk-oczen-' /tmp/zen-data/api-keys.txt
          echo "key file mode: $(sudo stat -c '%a %U:%G' /tmp/zen-data/api-keys.txt)"
          echo "unauthorized status: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8211/v1/models)"
          echo "--- container log ---"; docker logs zen-gateway
          docker rm -f zen-gateway
